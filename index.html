<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hunter's Dream </title>

    <!-- Google Font: EB Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <style>
        /* Exact CSS variables extracted from DevTools */
        :root {
            --bg-dark: #050608;
            --bg-surface: #0d1014;
            --bg-card: #12161b;
            --border-blood: #2b2f35;
            --border-subtle: #22262c;
            --text-gold: #d9d3c4;
            --text-muted: #9a958a;
            --text-dim: #7a766d;
            --highlight-gold: #c9a96a;
            --panel: linear-gradient(180deg, rgba(14, 17, 21, 0.78), rgba(8, 10, 13, 0.88)), url(https://dev.thehuntersdream.com/static/img/game/slate.jpg) center / cover;
        }

        /* Body & Full Background Implementation */
        body {
            font-family: 'EB Garamond', 'Georgia', serif;
            background: radial-gradient(ellipse at 50% 0%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.75) 100%), url(https://dev.thehuntersdream.com/static/img/game/menu-bg.jpg) center top / cover fixed, var(--bg-dark);
            color: var(--text-gold);
            font-size: 1.02rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.5;
        }

        /* Fully transparent header matching the original site layout */
        header {
            width: 100%;
            text-align: center;
            padding: 50px 0 30px 0;
            background: transparent;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin: 0;
            text-transform: uppercase;
            color: var(--text-gold);
            font-weight: 500;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 6px;
            text-transform: uppercase;
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 0 20px 50px 20px;
            box-sizing: border-box;
        }

        /* Dropzone styled using site panel textures */
        .dropzone {
            background: var(--panel);
            border: 1px solid var(--border-blood);
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--highlight-gold);
            box-shadow: 0 0 15px rgba(201, 169, 106, 0.2);
        }

        .dropzone p {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-gold);
        }

        .dropzone span {
            font-size: 0.85rem;
            color: var(--text-dim);
            display: block;
            margin-top: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .results-section {
            background: var(--panel);
            border: 1px solid var(--border-blood);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 0.95rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 10px;
            margin-top: 0;
            letter-spacing: 2px;
            color: var(--highlight-gold);
        }

        .file-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-family: 'Courier New', Courier, monospace;
        }

        .log-box {
            background: rgba(3, 4, 6, 0.95);
            border: 1px solid var(--border-subtle);
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.82rem;
            color: var(--text-gold);
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Hunter's Dream</h1>
        <p class="subtitle">PC Log Viewer & Drag Upload Utility</p>
    </header>

    <div class="container">
        <!-- Drag & Drop Zone -->
        <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
            <p>[+] Drag & Drop or Select Log File</p>
            <span>Supported Formats: .log, .txt</span>
            <input type="file" id="file-input" accept=".log,.txt" onchange="handleFile(this.files[0])">
        </div>

        <!-- Raw Log Content Panel -->
        <div class="results-section" id="preview-container" style="display: none;">
            <h2>Log Content Preview</h2>
            <div class="file-details" id="file-info"></div>
            <div class="log-box" id="log-preview"></div>
        </div>
    </div>

    <script>
        // Initialize dropzone elements and drag events
        const dropzone = document.getElementById('dropzone');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            }, false);
        });

        dropzone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFile(files[0]);
        });

        // Handle uploaded or dropped log file
        function handleFile(file) {
            if (!file) return;
            
            document.getElementById('file-info').innerText = `File: ${file.name} | Size: ${(file.size/1024).toFixed(1)} KB`;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                document.getElementById('log-preview').innerText = content;
                document.getElementById('preview-container').style.display = 'block';
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
